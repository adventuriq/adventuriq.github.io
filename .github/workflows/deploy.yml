name: Build & Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via VPS bridge
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: root
          REMOTE_PORT: 22
          SOURCE: build/
          TARGET: /tmp/docs-build/
          ARGS: "-rlgoDz --delete"
          SCRIPT_AFTER: |
            sshpass -p '${{ secrets.DINA_PASSWORD }}' rsync -rlgoDz --delete /tmp/docs-build/ adventuriq@hl1446.dinaserver.com:/home/adventuriq/www/docs/
            rm -rf /tmp/docs-build/
