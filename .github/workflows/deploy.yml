name: Build & Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via VPS
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DINA_PASS: ${{ secrets.DINA_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -p 2222 -i ~/.ssh/id_deploy root@$VPS_HOST \
            "cd /root/adventuriq-docs && git pull origin main && npm run build && sshpass -p '$DINA_PASS' rsync -rlgoDz --delete build/ adventuriq@hl1446.dinaserver.com:/home/adventuriq/www/docs/"
